model:
  base_model: "Qwen/Qwen2.5-0.5B-Instruct"

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true
  bnb_4bit_quant_type: "nf4"

qlora:
  r: 4
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  train_file: "D:/B.TECH/Projects/medqa-hindi/data/processed/train.jsonl"
  validation_file: "D:/B.TECH/Projects/medqa-hindi/data/processed/validation.jsonl"
  max_samples: 30000

training:
  output_dir: "./outputs/qlora_rtx2050_full"

  num_train_epochs: 1

  # Safer for 4GB RTX2050
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1

  # Increase effective throughput without VRAM spike
  gradient_accumulation_steps: 4

  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"

  optim: "paged_adamw_8bit"

  weight_decay: 0.01
  max_grad_norm: 0.3

  logging_steps: 100

  # Custom checkpoint callback handles saving
  save_strategy: "no"
  save_steps: 500
  save_total_limit: 5

  eval_strategy: "no"

  # More context than before but safer than 384
  max_seq_length: 275

  fp16: true
  bf16: false

  gradient_checkpointing: true

  report_to: "none"

  warmup_ratio: 0.05