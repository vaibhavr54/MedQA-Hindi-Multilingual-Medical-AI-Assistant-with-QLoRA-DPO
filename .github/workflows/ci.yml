name: MedQA-Hindi CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Check imports
        run: |
          python -c "from api.models import AskRequest, AskResponse, CompareRequest, CompareResponse, MetricsResponse, HealthResponse"
          python -c "from api.main import app"
          echo "✅ All imports OK"

      - name: Run API tests
        run: |
          pytest tests/test_api.py -v --tb=short

      - name: Run evaluation metric tests
        run: |
          pytest tests/test_evaluation.py -v --tb=short -m "not slow"

      - name: Test summary
        if: always()
        run: |
          echo "========================================"
          echo "CI Complete"
          echo "========================================"